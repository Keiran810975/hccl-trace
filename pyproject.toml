[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hccl-trace-diag"
version = "0.1.0"
description = "Evidence-bounded offline HCCL trace diagnosis"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
hccl-diag = "hccl.tools.diagnosis.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["hccl_trace*", "hccl.tools.diagnosis*"]
namespaces = true
